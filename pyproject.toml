[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofgame-prototype"
version = "0.1.0"
description = "Finite-action proof game and randomly initialized Transformer baseline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.2,<3"]

[tool.setuptools.packages.find]
include = ["proofgame*"]
